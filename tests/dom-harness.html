<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT RTL DOM harness</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { font-family: sans-serif; }
    form { display:block; width:640px; min-height:80px; }
    #prompt-textarea, [data-composer-markdown] { display:block; width:520px; min-height:40px; }
    button { width:32px; height:32px; }
    .katex { display:inline-block; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  </style>
</head>
<body>
  <aside><form><div id="sidebar-search" contenteditable="true" role="textbox" aria-label="Search chats" style="width:180px;height:30px">חיפוש</div></form></aside>
  <main id="main">
    <div id="conversation">
      <section data-testid="conversation-turn-20" data-turn="user" id="user-turn">
        <div data-user-message-bubble><div class="whitespace-pre-wrap" id="user-text">שלום from user</div></div>
      </section>
      <section data-testid="conversation-turn-21" data-turn="assistant" id="assistant-turn">
        <h4 class="sr-only" data-conversation-role="assistant" id="role-label">ChatGPT said:</h4>
        <div data-markdown-text-style="assistant-message" id="assistant-root">
          <p id="hebrew">שלום עולם with English</p>
          <div class="unknown"><span id="direct">טקסט ישיר</span></div>
          <ul id="list"><li id="li">פריט ראשון<ul id="nested-list"><li>תת פריט</li></ul></li></ul>
          <p>Run <code id="inline-code">npm install</code></p>
          <pre id="pre"><code>const x = 1;</code></pre>
          <span class="katex" data-math-source="x^2" id="math">x²</span>
          <table id="table"><tr><th id="th">כותרת</th><td id="td">123</td></tr></table>
          <p><a id="url" href="https://example.com">https://example.com/a?b=1</a></p>
          <span role="status" id="status">Thinking…</span>
          <span data-testid="citation-pill" id="citation">Citation</span>
        </div>
      </section>
      <div data-turn-key="11111111-2222-3333-4444-555555555555" id="combined-turn">
        <div data-user-message-bubble><div class="whitespace-pre-wrap" id="combined-user">עוד הודעה</div></div>
        <div data-markdown-text-style="assistant-message"><p id="combined-assistant">עוד תשובה</p></div>
      </div>
    </div>

    <form data-chatgpt-composer id="composer-form">
      <div id="prompt-textarea" data-composer-markdown="true" contenteditable="true" role="textbox">בדיקה</div>
      <div id="controls"><button type="button" aria-label="Attach files">+</button><button type="button" aria-label="Voice mode">V</button><button type="submit" data-testid="composer-send-button" id="send">S</button></div>
    </form>
  </main>

  <pre id="results">RUNNING</pre>
  <script>
    (() => {
      const store = { chatgpt_rtl_mode: 'rtl' };
      const listeners = [];
      const messageListeners = [];
      const api = (area) => ({
        get: async (key) => ({ [key]: store[key] }),
        set: async (obj) => {
          for (const [key, value] of Object.entries(obj)) {
            const oldValue = store[key];
            store[key] = value;
            if (JSON.stringify(oldValue) !== JSON.stringify(value)) {
              listeners.forEach((fn) => fn({ [key]: { oldValue, newValue: value } }, area));
            }
          }
        }
      });
      window.__store = store;
      window.__emitExtensionMessage = (message) => new Promise((resolve) => {
        for (const fn of messageListeners) {
          const async = fn(message, {}, resolve);
          if (async !== true) resolve(undefined);
        }
      });
      window.chrome = {
        storage: {
          sync: api('sync'),
          local: api('local'),
          onChanged: { addListener(fn) { listeners.push(fn); } }
        },
        runtime: { onMessage: { addListener(fn) { messageListeners.push(fn); } } }
      };
    })();
  </script>
  <script src="../core.js"></script>
  <script src="../ui.js"></script>
  <script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (value, message) => { if (!value) throw new Error(message); };

    (async () => {
      try {
        await sleep(350);
        assert(document.documentElement.dataset.chatgptRtlMode === 'rtl', 'default/migrated mode should be RTL');
        assert(typeof window.__store.chatgpt_rtl_mode === 'object', 'old string storage should migrate to a record');

        const host = document.getElementById('chatgpt-rtl-toggle-host');
        const send = document.getElementById('send');
        assert(host?.dataset.placement === 'inline', 'toggle should mount inline');
        assert(host.nextSibling === send, 'toggle should mount immediately before send');
        assert(document.getElementById('prompt-textarea').hasAttribute('data-chatgpt-rtl-composer'), 'composer should be positively marked');

        for (const id of ['user-text','hebrew','direct','li','combined-user','combined-assistant']) {
          assert(getComputedStyle(document.getElementById(id)).direction === 'rtl', `${id} should be RTL`);
        }
        assert(getComputedStyle(document.getElementById('inline-code')).direction === 'ltr', 'inline code should stay LTR');
        assert(getComputedStyle(document.getElementById('pre')).direction === 'ltr', 'pre should stay LTR');
        assert(getComputedStyle(document.getElementById('math')).direction === 'ltr', 'math should stay LTR');
        assert(getComputedStyle(document.getElementById('table')).direction === 'ltr', 'table structure should stay LTR');
        assert(getComputedStyle(document.getElementById('th')).direction === 'rtl', 'table prose should be RTL');
        assert(document.getElementById('list').hasAttribute('data-chatgpt-rtl-list'), 'list should be marked');
        assert(document.getElementById('nested-list').hasAttribute('data-chatgpt-rtl-list'), 'nested list should be marked');
        assert(document.getElementById('table').hasAttribute('data-chatgpt-rtl-table'), 'table should be marked');
        assert(document.getElementById('url').hasAttribute('data-chatgpt-rtl-island'), 'link should be isolated');
        assert(!document.getElementById('status').hasAttribute('data-chatgpt-rtl-text'), 'status must not be prose');
        assert(!document.getElementById('citation').hasAttribute('data-chatgpt-rtl-text'), 'citation must not be prose');
        assert(!document.getElementById('role-label').hasAttribute('data-chatgpt-rtl-text'), 'screen-reader role label must not be prose');
        assert(getComputedStyle(document.getElementById('sidebar-search')).direction === 'ltr', 'sidebar search must not be composer');

        host.shadowRoot.querySelector('button').click();
        await sleep(80);
        assert(document.documentElement.dataset.chatgptRtlMode === 'ltr', 'UI button should toggle LTR');
        assert(getComputedStyle(document.getElementById('hebrew')).direction === 'ltr', 'prose should switch LTR');
        assert(getComputedStyle(document.getElementById('prompt-textarea')).direction === 'ltr', 'composer should switch LTR');
        await window.__emitExtensionMessage({ type: 'chatgpt-rtl:toggle' });
        await sleep(80);
        assert(document.documentElement.dataset.chatgptRtlMode === 'rtl', 'toolbar message path should toggle back RTL');

        send.dataset.testid = 'stop-button';
        send.setAttribute('aria-label', 'Stop generating');
        await sleep(250);
        assert(host.nextSibling === send, 'toggle should remain next to Stop instead of jumping to an unrelated control');
        delete send.dataset.testid;
        send.dataset.testid = 'composer-send-button';
        send.setAttribute('aria-label', 'Send message');
        await sleep(250);
        assert(host.nextSibling === send, 'toggle should stay next to Send after streaming ends');

        const streamed = document.createElement('p');
        streamed.id = 'streamed';
        streamed.appendChild(document.createTextNode(''));
        document.getElementById('assistant-root').appendChild(streamed);
        for (let i = 0; i < 40; i += 1) streamed.firstChild.nodeValue += 'א';
        await sleep(220);
        assert(streamed.hasAttribute('data-chatgpt-rtl-text'), 'streamed paragraph should be marked after burst mutations');
        assert(getComputedStyle(streamed).direction === 'rtl', 'streamed paragraph should be RTL');

        const generic = document.createElement('section');
        generic.dataset.turn = 'assistant';
        generic.id = 'generic-turn';
        generic.innerHTML = '<div><ul id="generic-list"><li id="generic-li">כללי</li></ul><table id="generic-table"><tr><td id="generic-td">תא</td></tr></table></div>';
        document.getElementById('conversation').appendChild(generic);
        await sleep(180);
        assert(document.getElementById('generic-list').hasAttribute('data-chatgpt-rtl-list'), 'generic turn list should be marked');
        assert(document.getElementById('generic-table').hasAttribute('data-chatgpt-rtl-table'), 'generic turn table should be marked');
        assert(getComputedStyle(document.getElementById('generic-li')).direction === 'rtl', 'generic list item should be RTL');
        assert(getComputedStyle(document.getElementById('generic-td')).direction === 'rtl', 'generic table cell should be RTL');

        document.getElementById('composer-form').remove();
        const shell = document.createElement('section');
        shell.id = 'new-shell';
        shell.innerHTML = '<form data-chatgpt-composer><div data-composer-markdown="true" contenteditable="true" role="textbox" id="new-editor" style="width:500px;height:40px">חדש</div></form><div data-testid="composer-trailing-actions"><button aria-label="Voice mode">V</button><button data-composer-submit id="new-send">S</button></div>';
        document.getElementById('main').appendChild(shell);
        await sleep(350);
        assert(host.nextSibling?.id === 'new-send', 'toggle should follow sibling toolbar send control');
        assert(document.getElementById('new-editor').hasAttribute('data-chatgpt-rtl-composer'), 'replacement composer should be marked');

        shell.remove();
        await sleep(300);
        assert(host.dataset.placement === 'floating' && host.parentElement === document.body, 'read-only conversation should get floating fallback');

        document.getElementById('conversation').remove();
        await sleep(300);
        assert(!document.getElementById('chatgpt-rtl-toggle-host'), 'non-chat page should remove floating toggle');

        const lateConversation = document.createElement('section');
        lateConversation.dataset.turn = 'assistant';
        lateConversation.innerHTML = '<p id="late-p">שיחה שנוספה מאוחר</p>';
        document.getElementById('main').appendChild(lateConversation);
        await sleep(300);
        const lateHost = document.getElementById('chatgpt-rtl-toggle-host');
        assert(lateHost?.dataset.placement === 'floating', 'late read-only conversation should create floating toggle');
        assert(getComputedStyle(document.getElementById('late-p')).direction === 'rtl', 'late conversation prose should be RTL');

        document.getElementById('results').textContent = 'PASS';
      } catch (error) {
        document.getElementById('results').textContent = 'FAIL: ' + (error?.stack || error);
      }
    })();
  </script>
</body>
</html>

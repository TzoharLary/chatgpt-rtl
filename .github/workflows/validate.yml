name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension
        run: ./scripts/validate.sh
      - name: Test trace analysis
        run: python3 tests/test-analyze-perf-trace.py
      - name: Test DOM regressions
        run: ./scripts/test-dom.sh
